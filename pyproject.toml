[project]
name = "dbaassistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pagidela-sushmitha", email = "sushmitha.pagidela@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.7.7",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "langsmith>=0.14.17",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "streamlit>=1.67.0",
]

[project.scripts]
dbaassistant = "dbaassistant:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
